<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Language Buddy v1.00</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Syne:wght@800&display=swap');
        
        :root {
            --sat: env(safe-area-inset-top);
            --sar: env(safe-area-inset-right);
            --sab: env(safe-area-inset-bottom);
            --sal: env(safe-area-inset-left);
        }

        body { 
            font-family: 'Noto Sans JP', sans-serif; 
            background: #f8fafc; 
            color: #1e293b; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .lang-text { line-height: 2.2; }
        .segment { 
            transition: all 0.2s; 
            border-bottom: 2px solid transparent; 
            padding: 2px 4px;
            border-radius: 4px;
            cursor: pointer;
            display: inline;
        }
        .segment:hover { background: #e0e7ff; }
        .segment.active { 
            background: #fbbf24; 
            border-bottom-color: #f59e0b;
            color: #000;
        }

        .waveform-container::-webkit-scrollbar { height: 4px; }
        .waveform-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .recording { animation: pulse-red 1.5s infinite; }

        #logWindow { z-index: 9999; backdrop-filter: blur(8px); }
        .drag-handle { cursor: move; }
    </style>
</head>
<body class="p-4 pb-20 select-none">

    <!-- 5.1 機能名、バージョン、設定メニュー -->
    <header class="max-w-4xl mx-auto mb-4 flex justify-between items-center pt-[--sat]">
        <h1 class="text-2xl font-black text-indigo-900 tracking-tighter italic">LANGUAGE BUDDY <span class="text-sm font-normal text-slate-400">v1.00</span></h1>
        <button onclick="toggleSettings()" class="p-2 bg-slate-200 rounded-full hover:bg-slate-300 transition shadow-sm">⚙️</button>
    </header>

    <main class="max-w-4xl mx-auto space-y-4">
        
        <!-- 5.2 ファイル保存・再生モード -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex gap-2">
                <button id="exportBtn" onclick="exportData()" class="hidden px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-bold shadow-lg hover:bg-indigo-700 transition">保存 (ZIP)</button>
                <button onclick="document.getElementById('fileInput').click()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-bold hover:bg-slate-200 transition">読み込み</button>
            </div>
            <div class="flex items-center gap-4 bg-slate-50 p-2 rounded-xl border border-slate-100">
                <div class="flex items-center gap-2">
                    <label class="flex items-center gap-1 text-xs font-bold text-slate-500"><input type="radio" name="playMode" value="continuous" checked> 連続再生</label>
                    <label class="flex items-center gap-1 text-xs font-bold text-slate-500"><input type="radio" name="playMode" value="manual"> 手動再生</label>
                </div>
                <div class="h-4 w-[1px] bg-slate-200"></div>
                <label class="flex items-center gap-1 text-xs font-bold text-slate-500"><input type="checkbox" id="repeatMode"> リピート</label>
            </div>
        </div>

        <!-- 5.3 計測開始・速度調整 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
            <div class="flex gap-2 items-center">
                <button id="startTimerBtn" onclick="startTimer()" class="flex-1 py-3 bg-emerald-500 text-white rounded-xl font-bold shadow-lg shadow-emerald-100 hover:bg-emerald-600 transition">計測開始</button>
                <div class="w-1/3 space-y-1">
                    <div class="flex justify-between text-[10px] font-bold text-slate-400"><span>SPEED</span><span id="speedVal">1.0x</span></div>
                    <input type="range" id="speedRange" min="0.5" max="2.0" step="0.1" value="1.0" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                </div>
            </div>
        </div>

        <!-- 5.4 テキスト貼り付け -->
        <div class="relative group">
            <div id="inputView" class="w-full min-h-[200px] p-4 bg-white border-2 border-dashed border-slate-200 rounded-2xl focus-within:border-indigo-400 transition-all">
                <textarea id="rawText" class="w-full h-40 focus:outline-none resize-none bg-transparent" placeholder="テキストを貼り付けてください (英語/中国語 自動判別)"></textarea>
                <div class="flex justify-end gap-2 mt-2">
                    <button onclick="document.getElementById('rawText').value=''" class="text-xs text-slate-400 hover:text-red-500">テキスト消去</button>
                    <button id="processBtn" onclick="generateSpeech()" class="px-6 py-2 bg-indigo-600 text-white rounded-lg font-bold shadow-md hover:bg-indigo-700 transition">解析 & 音声生成</button>
                </div>
            </div>
            <div id="readView" class="hidden w-full min-h-[200px] p-6 bg-white border border-slate-100 rounded-2xl shadow-inner lang-text overflow-y-auto max-h-[50vh]">
                <!-- Segments will appear here -->
            </div>
        </div>

        <!-- 5.5 計測停止 -->
        <button id="stopTimerBtn" onclick="stopTimer()" class="hidden w-full py-3 bg-rose-500 text-white rounded-xl font-bold shadow-lg shadow-rose-100 hover:bg-rose-600 transition">計測停止</button>

        <!-- 5.6 統計表示 -->
        <div id="statPanel" class="hidden grid grid-cols-3 gap-4">
            <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100 text-center">
                <div id="countLabel" class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest">Count</div>
                <div id="totalCount" class="text-xl font-black text-indigo-700">-</div>
            </div>
            <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100 text-center">
                <div class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest">Time</div>
                <div id="elapsedTime" class="text-xl font-black text-indigo-700">0.0s</div>
            </div>
            <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100 text-center">
                <div id="speedMetricLabel" class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest">CPM/WPM</div>
                <div id="speedMetric" class="text-xl font-black text-indigo-700">-</div>
            </div>
        </div>

        <!-- 5.7 オーディオ波形シークバー -->
        <div id="playerControls" class="hidden space-y-2">
            <div class="flex justify-between items-center px-1">
                <span id="currentTime" class="text-[10px] font-bold text-slate-400">0:00</span>
                <div class="flex gap-4">
                    <button id="prevSeg" class="text-slate-400 hover:text-indigo-600">⏮</button>
                    <button id="playPauseBtn" class="text-indigo-600 text-xl font-bold">▶️</button>
                    <button id="nextSeg" class="text-slate-400 hover:text-indigo-600">⏭</button>
                </div>
                <span id="durationTime" class="text-[10px] font-bold text-slate-400">0:00</span>
            </div>
            <div class="bg-slate-900 rounded-xl p-2 relative overflow-hidden">
                <div id="waveformScroll" class="waveform-container overflow-x-auto h-24 relative select-none">
                    <canvas id="waveCanvas" class="h-full"></canvas>
                    <div id="markers" class="absolute inset-0 pointer-events-none"></div>
                    <div id="playhead" class="absolute top-0 bottom-0 w-0.5 bg-yellow-400 pointer-events-none z-10"></div>
                </div>
                <div class="flex justify-end gap-2 mt-1">
                    <button onclick="changeZoom(0.8)" class="text-[10px] text-slate-400 bg-slate-800 px-2 py-0.5 rounded">Zoom -</button>
                    <button onclick="changeZoom(1.2)" class="text-[10px] text-slate-400 bg-slate-800 px-2 py-0.5 rounded">Zoom +</button>
                </div>
            </div>
        </div>

        <!-- 5.8 単語帳CSV・クリアボタン -->
        <!-- 5.9 単語リスト -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50/50">
                <h3 class="font-bold text-sm text-slate-600">Vocabulary List</h3>
                <div class="flex gap-2">
                    <button onclick="exportCSV()" class="text-xs bg-indigo-50 text-indigo-600 px-3 py-1 rounded-lg font-bold border border-indigo-100 hover:bg-indigo-100 transition">CSV保存</button>
                    <button onclick="clearVocab()" class="text-xs bg-rose-50 text-rose-600 px-3 py-1 rounded-lg font-bold border border-rose-100 hover:bg-rose-100 transition">クリア</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b text-[10px] text-slate-400 uppercase tracking-wider">
                        <tr>
                            <th class="p-3 font-bold">Word / Pinyin</th>
                            <th class="p-3 font-bold">Japanese</th>
                            <th class="p-3 font-bold">Examples / Others</th>
                            <th class="p-3 w-10 text-center">Del</th>
                        </tr>
                    </thead>
                    <tbody id="vocabBody" class="divide-y divide-slate-100"></tbody>
                </table>
                <div id="vocabEmpty" class="p-10 text-center text-slate-300 text-sm italic">No words added yet.</div>
            </div>
        </div>
    </main>

    <!-- ログウィンドウ (5. レイアウト要件) -->
    <div id="logWindow" class="fixed bottom-4 right-4 w-64 h-10 transition-all overflow-hidden bg-slate-900 shadow-2xl rounded-xl border border-slate-700 flex flex-col">
        <div class="drag-handle bg-slate-800 p-2 flex justify-between items-center shrink-0">
            <span class="text-[10px] font-bold text-slate-400">SYSTEM LOG</span>
            <div class="flex gap-1">
                <button onclick="copyLog()" class="text-[10px] text-slate-500 hover:text-white px-1">Copy</button>
                <button onclick="toggleLog()" id="logToggleBtn" class="text-[10px] text-slate-500 hover:text-white px-1">Expand</button>
            </div>
        </div>
        <div id="logContent" class="p-2 text-[10px] font-mono text-emerald-400 overflow-y-auto grow whitespace-pre-wrap"></div>
        <div class="bg-slate-800 h-1 cursor-ns-resize" id="logResizer"></div>
    </div>

    <!-- 単語調べトリガー -->
    <div id="searchTrigger" class="fixed hidden bg-indigo-600 text-white px-3 py-1.5 rounded-full shadow-xl font-bold text-xs cursor-pointer hover:scale-105 transition-transform z-[10000]">この単語を調べますか？</div>

    <!-- 設定モーダル -->
    <div id="settingsModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[20000]">
        <div class="bg-white rounded-3xl w-full max-w-md p-8 shadow-2xl">
            <h2 class="text-2xl font-black mb-2">Settings</h2>
            <p class="text-sm text-slate-500 mb-6">Gemini API Key を入力してください。</p>
            <input type="password" id="apiKeyInput" class="w-full p-4 bg-slate-100 rounded-2xl mb-4 focus:ring-2 ring-indigo-500 outline-none transition-all" placeholder="AIZA...">
            <button onclick="saveSettings()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg hover:bg-indigo-700 transition">保存して開始</button>
        </div>
    </div>

    <input type="file" id="fileInput" class="hidden" accept=".zip">
    <audio id="audioEngine" class="hidden"></audio>

    <script>
        // -------------------------------------------------------------------------
        // Core State & Config
        // -------------------------------------------------------------------------
        const $ = id => document.getElementById(id);
        const CONFIG = {
            MODELS: {
                TEXT: 'gemini-3-flash-preview',
                TTS: 'gemini-2.5-flash-preview-tts'
            },
            STORAGE_KEYS: {
                API: 'lb_api_key_v1',
                VOCAB: 'lb_vocab_v1'
            }
        };

        let userKey = localStorage.getItem(CONFIG.STORAGE_KEYS.API) || "";
        let segments = [];
        let vocabList = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEYS.VOCAB) || "[]");
        let audioBuffer = null;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let timerStart = 0;
        let timerInterval = null;
        let zoomLevel = 1.0;
        let isWebSpeechMode = false;
        let currentLanguage = 'zh'; // 'zh' or 'en'

        // -------------------------------------------------------------------------
        // Logging
        // -------------------------------------------------------------------------
        function log(msg) {
            const now = new Date();
            const ts = `[${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}]`;
            const content = $('logContent');
            content.textContent += `${ts} ${msg}\n`;
            content.scrollTop = content.scrollHeight;
        }

        function toggleLog() {
            const win = $('logWindow');
            const isMin = win.clientHeight < 50;
            win.style.height = isMin ? '300px' : '40px';
            win.style.width = isMin ? '400px' : '160px';
            $('logToggleBtn').textContent = isMin ? 'Collapse' : 'Expand';
        }

        function copyLog() {
            navigator.clipboard.writeText($('logContent').textContent);
            log("Log copied to clipboard.");
        }

        // -------------------------------------------------------------------------
        // Language & Segmentation Logic
        // -------------------------------------------------------------------------
        function detectLanguage(text) {
            const zhMatch = text.match(/[\u4e00-\u9fa5]/g) || [];
            const enMatch = text.match(/[a-zA-Z]/g) || [];
            return zhMatch.length > enMatch.length * 0.3 ? 'zh' : 'en';
        }

        function segmentText(text, lang) {
            const segs = [];
            if (lang === 'zh') {
                // 中国語: 句読点、30文字目安
                const parts = text.split(/([，。！？；：\n])/);
                let buffer = "";
                parts.forEach(p => {
                    if(!p) return;
                    buffer += p;
                    if (/[。！？\n]/.test(p) || buffer.length >= 30) {
                        segs.push(buffer.trim());
                        buffer = "";
                    }
                });
                if(buffer) segs.push(buffer.trim());
            } else {
                // 英語: ピリオド等、20単語目安
                const sentences = text.split(/([.!?\n])/);
                let buffer = "";
                sentences.forEach(s => {
                    if(!s) return;
                    buffer += s;
                    const wordCount = buffer.trim().split(/\s+/).length;
                    if (/[.!?\n]/.test(s) || wordCount >= 20) {
                        segs.push(buffer.trim());
                        buffer = "";
                    }
                });
                if(buffer) segs.push(buffer.trim());
            }
            return segs.filter(s => s.length > 0);
        }

        // -------------------------------------------------------------------------
        // API Calls
        // -------------------------------------------------------------------------
        async function callGemini(payload, model = CONFIG.MODELS.TEXT) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${userKey}`;
            let retries = 0;
            const delays = [1000, 2000, 4000, 8000, 16000];

            while (retries < 5) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    
                    if (response.status === 429) {
                        if (model === CONFIG.MODELS.TTS) {
                            const errorMsg = data.error?.message || "";
                            const timeMatch = errorMsg.match(/(\d{2}:\d{2}:\d{2})/);
                            throw { type: 'TTS_LIMIT', resumeAt: timeMatch ? timeMatch[0] : "しばらく経ってから" };
                        }
                        await new Promise(r => setTimeout(r, delays[retries++]));
                        continue;
                    }
                    if (!response.ok) throw new Error(data.error?.message || "API Request Failed");
                    return data;
                } catch (e) {
                    if (e.type === 'TTS_LIMIT') throw e;
                    if (retries >= 4) throw e;
                    await new Promise(r => setTimeout(r, delays[retries++]));
                }
            }
        }

        // -------------------------------------------------------------------------
        // Audio & TTS
        // -------------------------------------------------------------------------
        async function generateSpeech() {
            const text = $('rawText').value.trim();
            if (!text || !userKey) return;

            log("Analyzing language...");
            currentLanguage = detectLanguage(text);
            log(`Detected: ${currentLanguage === 'zh' ? 'Chinese' : 'English'}`);

            segments = segmentText(text, currentLanguage).map((t, i) => ({ id: i, text: t, start: 0, end: 0 }));
            renderSegments();
            toggleUI(true);

            try {
                log(`Requesting TTS for ${text.length} chars...`);
                const voice = currentLanguage === 'zh' ? "Kore" : "Puck";
                const payload = {
                    contents: [{ parts: [{ text: text }] }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } }
                    }
                };

                const result = await callGemini(payload, CONFIG.MODELS.TTS);
                const audioBase64 = result.candidates[0].content.parts[0].inlineData.data;
                const buffer = base64ToArrayBuffer(audioBase64);
                await initAudio(buffer);
                autoAlign();
                log("Audio ready.");
            } catch (e) {
                if (e.type === 'TTS_LIMIT') {
                    const ok = confirm(`レート制限に達しました。復帰時刻: ${e.resumeAt}\nWebSpeechAPIモードに切り替えますか？`);
                    if (ok) {
                        isWebSpeechMode = true;
                        log("Switched to WebSpeechAPI Mode.");
                    }
                } else {
                    log("Error: " + e.message);
                }
            }
        }

        function base64ToArrayBuffer(base64) {
            const bin = atob(base64);
            const len = bin.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
            return bytes.buffer;
        }

        async function initAudio(buffer) {
            const decoded = await audioCtx.decodeAudioData(buffer.slice(0));
            audioBuffer = decoded;
            const wav = bufferToWav(decoded);
            const blob = new Blob([wav], { type: 'audio/wav' });
            $('audioEngine').src = URL.createObjectURL(blob);
            drawWaveform();
            $('playerControls').classList.remove('hidden');
            $('exportBtn').classList.remove('hidden');
        }

        function autoAlign() {
            if (!audioBuffer) return;
            const totalDur = audioBuffer.duration;
            const totalUnits = currentLanguage === 'zh' 
                ? segments.reduce((a, b) => a + b.text.length, 0)
                : segments.reduce((a, b) => a + b.text.split(/\s+/).length, 0);

            let current = 0;
            segments.forEach(s => {
                const units = currentLanguage === 'zh' ? s.text.length : s.text.split(/\s+/).length;
                const ratio = units / totalUnits;
                s.start = current;
                s.end = current + (totalDur * ratio);
                current = s.end;
            });
            renderMarkers();
        }

        // -------------------------------------------------------------------------
        // Visualization & UI
        // -------------------------------------------------------------------------
        function renderSegments() {
            const container = $('readView');
            container.innerHTML = segments.map(s => `<span id="seg-${s.id}" class="segment" onclick="playFromSegment(${s.id})">${s.text}</span>`).join(' ');
        }

        function toggleUI(isReading) {
            $('inputView').classList.toggle('hidden', isReading);
            $('readView').classList.toggle('hidden', !isReading);
            $('processBtn').classList.toggle('hidden', isReading);
        }

        function drawWaveform() {
            const canvas = $('waveCanvas');
            const ctx = canvas.getContext('2d');
            const data = audioBuffer.getChannelData(0);
            const step = Math.ceil(data.length / (window.innerWidth * 5 * zoomLevel));
            canvas.width = data.length / step;
            canvas.height = 100;
            
            ctx.fillStyle = '#4f46e5';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < canvas.width; i++) {
                let min = 1.0, max = -1.0;
                for (let j = 0; j < step; j++) {
                    const datum = data[(i * step) + j];
                    if (datum < min) min = datum;
                    if (datum > max) max = datum;
                }
                ctx.fillRect(i, (1 + min) * 50, 1, Math.max(1, (max - min) * 50));
            }
            $('durationTime').textContent = formatTime(audioBuffer.duration);
        }

        function renderMarkers() {
            const container = $('markers');
            container.innerHTML = '';
            const totalDur = audioBuffer.duration;
            const canvasWidth = $('waveCanvas').width;

            segments.forEach((s, i) => {
                const x = (s.start / totalDur) * canvasWidth;
                const marker = document.createElement('div');
                marker.className = "absolute top-0 bottom-0 border-l-2 border-yellow-500 cursor-ew-resize pointer-events-auto z-20 group";
                marker.style.left = `${x}px`;
                marker.innerHTML = `<span class="bg-yellow-500 text-[8px] px-1 rounded-r text-black font-bold opacity-0 group-hover:opacity-100">${i+1}</span>`;
                
                // Dragging logic
                let isDragging = false;
                marker.onmousedown = (e) => { isDragging = true; e.stopPropagation(); };
                window.onmousemove = (e) => {
                    if (!isDragging) return;
                    const rect = $('waveformScroll').getBoundingClientRect();
                    const newX = e.clientX - rect.left + $('waveformScroll').scrollLeft;
                    const newTime = (newX / canvasWidth) * totalDur;
                    s.start = Math.max(0, newTime);
                    if (i > 0) segments[i-1].end = s.start;
                    marker.style.left = `${newX}px`;
                };
                window.onmouseup = () => { if(isDragging) { isDragging = false; renderMarkers(); } };
                container.appendChild(marker);
            });
        }

        function changeZoom(m) {
            zoomLevel *= m;
            if(audioBuffer) { drawWaveform(); renderMarkers(); }
        }

        // -------------------------------------------------------------------------
        // Playback Logic
        // -------------------------------------------------------------------------
        function playFromSegment(id) {
            const s = segments[id];
            const audio = $('audioEngine');
            audio.currentTime = s.start;
            audio.play();
            highlight(id);
        }

        function highlight(id) {
            document.querySelectorAll('.segment').forEach(el => el.classList.remove('active'));
            const el = $(`seg-${id}`);
            if(el) el.classList.add('active');
        }

        $('audioEngine').ontimeupdate = () => {
            const time = $('audioEngine').currentTime;
            $('currentTime').textContent = formatTime(time);
            const canvasWidth = $('waveCanvas').width;
            $('playhead').style.left = `${(time / audioBuffer.duration) * canvasWidth}px`;

            const seg = segments.find(s => time >= s.start && time < s.end);
            if(seg) highlight(seg.id);

            const mode = document.querySelector('input[name="playMode"]:checked').value;
            if (mode === 'manual' && seg && time >= seg.end - 0.1) {
                $('audioEngine').pause();
            }
        };

        $('audioEngine').onended = () => {
            if ($('repeatMode').checked) {
                $('audioEngine').currentTime = 0;
                $('audioEngine').play();
            }
        };

        $('playPauseBtn').onclick = () => {
            const audio = $('audioEngine');
            if (audio.paused) audio.play(); else audio.pause();
        };

        $('prevSeg').onclick = () => {
            const time = $('audioEngine').currentTime;
            const idx = segments.findIndex(s => time >= s.start && time < s.end);
            if(idx > 0) playFromSegment(idx - 1);
        };

        $('nextSeg').onclick = () => {
            const time = $('audioEngine').currentTime;
            const idx = segments.findIndex(s => time >= s.start && time < s.end);
            if(idx < segments.length - 1) playFromSegment(idx + 1);
        };

        $('speedRange').oninput = (e) => {
            const val = parseFloat(e.target.value);
            $('speedVal').textContent = val.toFixed(1) + "x";
            $('audioEngine').playbackRate = val;
        };

        // -------------------------------------------------------------------------
        // Timer & Stats (2. 要件)
        // -------------------------------------------------------------------------
        function startTimer() {
            timerStart = Date.now();
            $('startTimerBtn').classList.add('hidden');
            $('stopTimerBtn').classList.remove('hidden');
            $('statPanel').classList.remove('hidden');
            log("Timer started.");
            
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - timerStart) / 1000;
                $('elapsedTime').textContent = elapsed.toFixed(1) + "s";
            }, 100);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            const elapsed = (Date.now() - timerStart) / 1000;
            const text = $('rawText').value.trim();
            const lang = detectLanguage(text);

            let count = 0;
            let metricLabel = "";
            let metricValue = 0;

            if (lang === 'zh') {
                count = text.replace(/\s/g, '').length;
                metricLabel = "CPM";
                metricValue = Math.round(count / (elapsed / 60));
                $('countLabel').textContent = "Characters";
            } else {
                count = text.trim().split(/\s+/).length;
                metricLabel = "WPM";
                metricValue = Math.round(count / (elapsed / 60));
                $('countLabel').textContent = "Words";
            }

            $('totalCount').textContent = count;
            $('speedMetricLabel').textContent = metricLabel;
            $('speedMetric').textContent = metricValue || 0;
            
            $('startTimerBtn').classList.remove('hidden');
            $('stopTimerBtn').classList.add('hidden');
            log(`Stopped. ${count} ${lang === 'zh' ? 'chars' : 'words'}, ${metricValue} ${metricLabel}`);
        }

        // -------------------------------------------------------------------------
        // Vocabulary Lookup (3. 要件)
        // -------------------------------------------------------------------------
        async function lookupWord(word) {
            if(!userKey) return;
            log(`Searching: ${word}...`);
            
            const prompt = currentLanguage === 'zh'
                ? `Analyze the Chinese word "${word}". Return JSON: { "col1": "Word(Pinyin)", "col2": "Japanese Meaning", "col3": "One example sentence and up to 3 synonymous English words" }`
                : `Analyze the English word "${word}". Return JSON: { "col1": "Word", "col2": "Japanese Meaning", "col3": "One example sentence and up to 3 synonymous Chinese words" }`;

            try {
                const data = await callGemini({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { 
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                col1: { type: "STRING" },
                                col2: { type: "STRING" },
                                col3: { type: "STRING" }
                            }
                        }
                    }
                });

                const result = JSON.parse(data.candidates[0].content.parts[0].text);
                if (confirm(`リストに追加しますか？\n\n${result.col1}\n${result.col2}\n${result.col3}`)) {
                    vocabList.unshift({ id: Date.now(), ...result });
                    saveVocab();
                }
            } catch (e) {
                log("Lookup Error: " + e.message);
            }
        }

        function saveVocab() {
            localStorage.setItem(CONFIG.STORAGE_KEYS.VOCAB, JSON.stringify(vocabList));
            renderVocab();
        }

        function renderVocab() {
            const body = $('vocabBody');
            const empty = $('vocabEmpty');
            if (vocabList.length === 0) {
                body.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');
            body.innerHTML = vocabList.map(v => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-3 text-sm font-bold text-indigo-600">${v.col1}</td>
                    <td class="p-3 text-sm">${v.col2}</td>
                    <td class="p-3 text-[10px] text-slate-500 italic">${v.col3}</td>
                    <td class="p-3 text-center"><button onclick="deleteVocab(${v.id})" class="text-rose-300 hover:text-rose-600 font-bold">×</button></td>
                </tr>
            `).join('');
        }

        function deleteVocab(id) {
            vocabList = vocabList.filter(v => v.id !== id);
            saveVocab();
        }

        function clearVocab() {
            if(confirm("全消去しますか？")) { vocabList = []; saveVocab(); }
        }

        function exportCSV() {
            let csv = "Word,Meaning,Details\n";
            vocabList.forEach(v => {
                // Remove commas for CSV safety per requirement
                const c1 = v.col1.replace(/,/g, ' ');
                const c2 = v.col2.replace(/,/g, ' ');
                const c3 = v.col3.replace(/,/g, ' ');
                csv += `${c1},${c2},${c3}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `vocab_${Date.now()}.csv`; a.click();
        }

        // -------------------------------------------------------------------------
        // Data Handling (ZIP)
        // -------------------------------------------------------------------------
        async function exportData() {
            log("Creating ZIP...");
            const zip = new JSZip();
            const audioBlob = await fetch($('audioEngine').src).then(r => r.blob());
            zip.file("audio.wav", audioBlob);
            zip.file("project.json", JSON.stringify({
                version: "1.00",
                text: $('rawText').value,
                lang: currentLanguage,
                segments: segments
            }));
            const content = await zip.generateAsync({ type: "blob" });
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url; a.download = `language_buddy_${Date.now()}.zip`; a.click();
            log("Export complete.");
        }

        $('fileInput').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            log("Loading ZIP...");
            const zip = await JSZip.loadAsync(file);
            const jsonStr = await zip.file("project.json").async("string");
            const data = JSON.parse(jsonStr);
            
            $('rawText').value = data.text;
            currentLanguage = data.lang || 'zh';
            segments = data.segments;
            
            const audioBlob = await zip.file("audio.wav").async("blob");
            const audioBuffer = await audioBlob.arrayBuffer();
            await initAudio(audioBuffer);
            
            toggleUI(true);
            renderSegments();
            renderMarkers();
            log("Project Loaded.");
        };

        // -------------------------------------------------------------------------
        // Utils & Event Listeners
        // -------------------------------------------------------------------------
        function toggleSettings() { $('settingsModal').classList.toggle('hidden'); }
        function saveSettings() {
            const key = $('apiKeyInput').value.trim();
            if(key) {
                userKey = key;
                localStorage.setItem(CONFIG.STORAGE_KEYS.API, key);
                toggleSettings();
                log("API Key updated.");
            }
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec.toString().padStart(2, '0')}`;
        }

        // Right-click lookup (3. 要件)
        const trg = $('searchTrigger');
        document.addEventListener('selectionchange', () => {
            const sel = window.getSelection().toString().trim();
            if (sel && sel.length < 20) {
                const range = window.getSelection().getRangeAt(0);
                const rect = range.getBoundingClientRect();
                trg.style.display = 'block';
                trg.style.top = (rect.top + window.scrollY - 35) + 'px';
                trg.style.left = (rect.left + window.scrollX) + 'px';
                trg.onmousedown = (e) => {
                    e.preventDefault();
                    lookupWord(sel);
                    trg.style.display = 'none';
                };
            } else {
                trg.style.display = 'none';
            }
        });

        // Draggable Log (4. 要件)
        let isDragging = false, dragX, dragY;
        const logWin = $('logWindow');
        logWin.querySelector('.drag-handle').onmousedown = e => {
            isDragging = true;
            dragX = e.clientX - logWin.offsetLeft;
            dragY = e.clientY - logWin.offsetTop;
        };
        window.onmousemove = e => {
            if(!isDragging) return;
            logWin.style.left = (e.clientX - dragX) + 'px';
            logWin.style.top = (e.clientY - dragY) + 'px';
            logWin.style.bottom = 'auto'; logWin.style.right = 'auto';
        };
        window.onmouseup = () => isDragging = false;

        // WAV Encoding helper
        function bufferToWav(abuffer) {
            let numOfChan = abuffer.numberOfChannels,
                length = abuffer.length * numOfChan * 2 + 44,
                buffer = new ArrayBuffer(length),
                view = new DataView(buffer),
                channels = [], i, sample,
                offset = 0, pos = 0;
            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
            setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
            setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);
            for(i=0; i<abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));
            while(pos < abuffer.length) {
                for(i=0; i<numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][pos]));
                    sample = (sample < 0 ? sample * 0x8000 : sample * 0x7FFF);
                    view.setInt16(44 + offset, sample, true);
                    offset += 2;
                }
                pos++;
            }
            return buffer;
        }

        window.onload = () => {
            renderVocab();
            log("Language Buddy v1.00 initialized.");
            if(!userKey) toggleSettings();
        };
    </script>
</body>
